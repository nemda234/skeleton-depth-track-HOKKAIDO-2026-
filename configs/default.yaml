paths:
  depth_checkpoint_url: "https://huggingface.co/depth-anything/Depth-Anything-V2-Small/resolve/main/depth_anything_v2_vits.pth"
  depth_torch_ckpt: "models/depth_anything_v2_vits.pth"
  pose_weights: "yolov8n-pose.pt"
  repo_dir: "third_party/Depth-Anything-V2"


depth:
  input_size: 252         
  encoder: "vits"          
  batch_size: 1             
                             

  use_torch_compile: false  
  colormap: "INFERNO"       

pose:
  imgsz: 320              
  half: true
  conf: 0.4
  tracker: "bytetrack.yaml"    
  every_n_frames: 1        

pipeline:
  resize_input_to: null    
  queue_maxsize: 8     
  save_video: true
  save_skeleton_data: true


output:
  dir: "outputs"
  video_name: "annotated.mp4"
  data_name: "skeleton_data.jsonl"
